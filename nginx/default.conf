# This is a reverse proxy configuration

server {
	listen 80;

	# sever_name: Server name that should be specified in the Host header.
	#server_name www.lab.local;

	location / {
		# proxy_pass: Destination. If you specify a hostname, Nginx will resolve the name.
		proxy_pass http://192.168.10.10:80;
		# proxy_set_header: Set a header when creating a new HTTP request.
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}


